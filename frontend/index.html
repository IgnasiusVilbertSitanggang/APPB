<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A national disaster reporting and management platform for citizens and officials, enabling efficient reporting, verification, and handling of disaster incidents." />
    <meta name="robots" content="noindex, nofollow" />
    <title>appb</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Tailwind v4 dijalankan lokal dari file vendor, tanpa CDN saat runtime. -->
    <script src="/vendor/tailwind-browser.js"></script>
    <style type="text/tailwindcss">
      @theme {
        --font-sans: 'Inter', system-ui, sans-serif;
        --color-ink: #0f172a;
        --color-ink2: #475569;
        --color-mute: #94a3b8;
        --color-line: #e2e8f0;
        --color-app: #f8fafc;
        --color-navy: #1e3a8a;
        --color-navyh: #1e40af;
        --color-crit: #b91c1c;
        --color-crit-t: #fef2f2;
        --color-warn: #b45309;
        --color-warn-t: #fffbeb;
        --color-ok: #15803d;
        --color-ok-t: #f0fdf4;
        --color-info: #1d4ed8;
        --color-info-t: #eff6ff;
        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 8px;
      }

      @layer base {
        html { color: var(--color-ink); background: var(--color-app); }
        body { font-family: var(--font-sans); font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
        svg.lucide { width: 16px; height: 16px; stroke-width: 1.5; flex-shrink: 0; }
        :focus-visible { outline: 2px solid var(--color-navy); outline-offset: 2px; }
        ::selection { background: #dbeafe; }
        input, select, textarea, button { font: inherit; }
      }

      @layer components {
        .inp { @apply w-full h-9 rounded-md border border-line bg-white px-3 text-sm text-ink placeholder:text-mute disabled:bg-app disabled:text-mute; }
        textarea.inp { @apply h-auto py-2; }
        .inp[aria-invalid='true'] { @apply border-crit; }
        .card { @apply rounded-lg border border-line bg-white; }
        .lbl { @apply block text-sm font-medium text-ink mb-1; }
        .help { @apply text-xs text-ink2 mt-1; }
        .err { @apply text-xs text-crit mt-1 flex items-center gap-1; }
        .h1 { @apply text-[30px] font-semibold leading-tight tracking-tight; }
        .h2 { @apply text-2xl font-semibold tracking-tight; }
        .h3 { @apply text-xl font-semibold; }
        .cap { @apply text-xs text-ink2; }
        .link { @apply text-navy underline-offset-2 hover:underline; }
        .th { @apply text-left text-xs font-medium text-ink2 bg-app border-b border-line px-3 py-2 whitespace-nowrap; }
        .td { @apply px-3 border-b border-line align-middle; }
      }

      @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
      @keyframes slidein { from { transform: translateX(16px); opacity: 0 } to { transform: none; opacity: 1 } }
      @keyframes rise { from { transform: translateY(6px); opacity: 0 } to { transform: none; opacity: 1 } }
      .anim-fade { animation: fadein 140ms ease-out; }
      .anim-slide { animation: slidein 160ms ease-out; }
      .anim-rise { animation: rise 140ms ease-out; }
      @keyframes pulse2 { 50% { opacity: .5 } }
      .skel { background: #eef2f6; border-radius: 4px; animation: pulse2 1.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .anim-fade, .anim-slide, .anim-rise, .skel { animation: none; }
      }

      @layer base {
        html, body, #app { width: 100%; min-height: 100%; }
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overflow-x: hidden; }
        body { overflow-x: hidden; min-height: 100dvh; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); -webkit-tap-highlight-color: transparent; }
        img, video, canvas, svg:not(.lucide) { max-width: 100%; height: auto; }
        table { max-width: 100%; }
      }
      @media (max-width: 767px) {
        input, select, textarea, .inp { font-size: 16px !important; }
        .h1 { font-size: 24px; }
        .h2 { font-size: 20px; }
      }
      @media (min-width: 1536px) { body { font-size: 15px; } }
    </style>

    <script src="/vendor/lucide.js"></script>
    <link rel="stylesheet" href="/css/overrides.css" />
    <script>
      // Default memakai proxy same-origin /api (Nginx). Untuk menjalankan frontend
      // statis langsung tanpa proxy, buka ?apiBase=http://localhost:8080/api
      // sekali; nilai tersebut disimpan di localStorage.appb-api-base.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var requested = params.get('apiBase');
        if (requested) localStorage.setItem('appb-api-base', requested);
        window.APPB_API_BASE = window.APPB_API_BASE
          || localStorage.getItem('appb-api-base')
          || '/api';
      })();
    </script>
  </head>
  <body>
    <div id="app"><div class="skel h-8 w-48 mt-8 mx-auto rounded-md"></div></div>
    <div id="toast-root" class="fixed right-4 bottom-4 z-[60] flex flex-col gap-2"></div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
