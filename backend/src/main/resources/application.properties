# ---- Server ----
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.error.include-message=always

# ---- Database (branch ken, PostgreSQL) ----
# Tabel logis (reports, users, ...) disediakan oleh tools/ken_compat.sql.
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:appb_db}
spring.datasource.username=${DB_USER:appb}
spring.datasource.password=${DB_PASSWORD:appb_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ---- SQL init ----
# Satu-satunya sumber data adalah dump branch `ken` (tools/import_ken_sql.py).
# Layer kompatibilitas Java dipasang oleh tools/ken_compat.sql (idempoten).
spring.sql.init.mode=never

# ---- Jackson ----
# Timestamp di dump ken sudah UTC; baseline API Python juga memakai UTC.
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always

# ---- CORS ----
# Layanan ini hanya untuk hosting lokal. Origin frontend bisa berbeda-beda
# (localhost:8081, 127.0.0.1:8081, IP LAN, atau preview), jadi pakai pattern
# "*". Spring akan tetap meng-echo origin yang diminta meski credentials=true.
app.cors.allowed-origins=${CORS_ORIGINS:*}

# ---- Logging ----
logging.level.root=INFO
logging.level.com.bpbd.appb=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

spring.application.name=appb-backend
